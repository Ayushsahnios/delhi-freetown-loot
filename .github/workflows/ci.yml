name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 (headless linux build)
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version

      - name: Headless import
        run: godot --headless --import .

      - name: Loudness balance check (audio mix)
        run: |
          timeout 180 godot --headless --path . res://scenes/loudness_check.tscn

      - name: Monsoon squall cycle gate (issue 205)
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . res://scenes/squall_check.tscn 2>&1 | tee /tmp/squall.log
          grep -q "verdict=PASS" /tmp/squall.log

      - name: Smoke run (5s, zero script errors)
        run: |
          set -o pipefail
          godot --headless --quit-after 5 . 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/smoke.log; then
            echo "::error::Smoke run produced SCRIPT ERROR / ERROR: output"
            exit 1
          fi

      - name: Save/load hardening gate (issue 169)
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . res://scenes/save_check.tscn 2>&1 | tee /tmp/save.log
          grep -q "verdict=PASS" /tmp/save.log

      - name: Police escalation gate (issue 188)
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . res://scenes/police_check.tscn 2>&1 | tee /tmp/police.log
          grep -q "verdict=PASS" /tmp/police.log

      - name: Perf budget gate (headless frame-time, issue 167)
        run: |
          set -o pipefail
          # --festival (issue #263): the budget always measures the Diwali
          # dressing, not only during the Nov 1-14 window.
          timeout 420 godot --headless --path . res://scenes/perf_check.tscn -- --frames 120 --warmup 45 --festival 2>&1 | tee /tmp/perf.log
          grep -q "verdict=PASS" /tmp/perf.log

      - name: Hygiene scan (no addresses or leaks in committed files)
        run: |
          if grep -rEn '([0-9]{1,3}\.){3}[0-9]{1,3}|toke[n]|passwor[d]|secre[t]' \
              --exclude-dir=.git --exclude-dir=.godot --exclude-dir=.github \
              --exclude=export_presets.cfg .; then
            echo "::error::Hygiene scan flagged content in tracked files"
            exit 1
          fi

  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 (headless linux build)
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version

      - name: Install Xvfb + Mesa software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri

      - name: Headless import
        run: godot --headless --import .

      - name: Render gameplay screenshots
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
            --rendering-driver opengl3 res://scenes/screenshot.tscn \
            -- --out shots/spawn.png --frames 120
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
            --rendering-driver opengl3 res://scenes/screenshot.tscn \
            -- --out shots/center.png --frames 150 --tp 253,253
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
            --rendering-driver opengl3 res://scenes/screenshot.tscn \
            -- --out shots/station-hall.png --frames 150 --tp -10.4,-245.5

      - name: Render title screen (portrait distinctness gate, issue 152)
        run: |
          # --title also saves each legend's portrait card and exits
          # nonzero when any pair of cards is pixel-near-identical —
          # the all-pink-portraits regression can never land silently.
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
            --rendering-driver opengl3 res://scenes/screenshot.tscn \
            -- --out shots/title.png --frames 90 --title

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots
          path: shots/
          if-no-files-found: error
